[versions]
agp = "9.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
# Koog 1.2.0 requires Kotlin 2.3.10+. Bumped from the template default (2.2.10). Pinned to
# 2.3.10 exactly: the Compose compiler plugin only ships versions matching Kotlin's own
# releases (2.3.0/2.3.10/2.3.20/2.3.21), unlike KSP which publishes extra patch builds.
kotlin = "2.3.10"
# No BOM: the A2UI renderer (1.0.0-alpha02) is built against Compose 1.13.0-alpha03 and
# material3 1.5.0-alpha28+, newer than any published BOM (the latest, 2026.09.00, is Compose 1.12.1
# / material3 1.4.0). Compose is pinned explicitly to 1.13.0-rc01 / material3 1.5.0-rc01 so every
# Compose artifact resolves to a single version. material-icons-extended is not versioned with
# Compose (last release 1.7.8).
compose = "1.13.0-rc01"
material3 = "1.5.0-rc01"
materialIcons = "1.7.8"
a2uiCompose = "1.0.0-alpha02"
appfunctions = "1.0.0-beta01"
koog = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "compose" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material3-a2ui = { group = "androidx.compose.material3", name = "material3-a2ui", version.ref = "a2uiCompose" }
androidx-a2ui-compose-ui = { group = "androidx.a2ui.compose", name = "compose-ui", version.ref = "a2uiCompose" }
androidx-a2ui-compose-runtime = { group = "androidx.a2ui.compose", name = "compose-runtime", version.ref = "a2uiCompose" }
appfunctions = { group = "androidx.appfunctions", name = "appfunctions", version.ref = "appfunctions" }
koog-agents = { group = "ai.koog", name = "koog-agents", version.ref = "koog" }
# koog-agents only pulls in LLM clients as runtime-scope deps, not compile-time ones, so
# GoogleLLMClient/GoogleModels need an explicit dependency. Note: unlike the other koog-*
# artifacts, prompt-executor-google-client's newest full release is 1.2.0-beta (no stable
# 1.2.0 was published for it) — its pom still pins the same kotlin-bom (2.3.10) and depends
# on the other ai.koog artifacts at the stable 1.2.0, so mixing versions is safe.
koog-prompt-executor-google-client = { group = "ai.koog", name = "prompt-executor-google-client", version = "1.2.0-beta" }
# Provides the KoogHttpClient.Factory service-loaded at runtime by the LLM clients (Ktor-backed).
koog-http-client-ktor = { group = "ai.koog", name = "http-client-ktor", version.ref = "koog" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

